<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiReal · 沉浸式場域娛樂平台</title>
<meta name="description" content="LiReal 提供沉浸式場域節目、直播互動、AI 夥伴陪伴與裸視 3D 精選商品，打造虛實整合的娛樂體驗。">
<meta property="og:title" content="LiReal · 沉浸式場域娛樂平台">
<meta property="og:description" content="沉浸節目、直播、AI 夥伴、場域售票與裸視 3D 精選。">
<meta property="og:type" content="website">
<style>
  :root{--bg:#0c0a12;--card:#181227;--card2:#1f1834;--line:rgba(167,139,206,.22);--line2:rgba(255,255,255,.07);
    --brand:#8b6fca;--brand2:#b9a3e6;--brand3:#c9b6f0;--text:#f2f0f7;--muted:#9d97ac;--rose:#e08fc0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
      radial-gradient(1100px 560px at 78% -10%,rgba(139,111,202,.20),transparent 60%),
      radial-gradient(900px 520px at 0% 10%,rgba(224,143,192,.10),transparent 55%),var(--bg);
    color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:48px 20px;line-height:1.6}
  .wrap{width:100%;max-width:900px}
  .head{text-align:center;margin-bottom:40px}
  .mark{width:62px;height:62px;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--rose));
    display:grid;place-items:center;font-weight:800;font-size:29px;color:#fff;margin:0 auto 18px;
    box-shadow:0 14px 40px rgba(139,111,202,.4)}
  .eyebrow{color:var(--brand3);letter-spacing:5px;font-size:12px;margin-bottom:12px}
  .head h1{font-size:38px;letter-spacing:2px;font-family:"Noto Serif TC",Georgia,serif;line-height:1.25}
  .head h1 span{background:linear-gradient(90deg,var(--brand),var(--brand2),var(--brand3));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .head p{color:var(--muted);font-size:15px;margin-top:12px;max-width:520px;margin-left:auto;margin-right:auto}
  .cta{display:flex;gap:14px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;font-size:15px;padding:15px 34px;border-radius:13px;font-weight:600;
    text-decoration:none;display:inline-block;transition:.2s;font-family:inherit}
  .btn-brand{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 30px rgba(139,111,202,.4)}
  .btn-brand:hover{transform:translateY(-2px)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand3)}
  .feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:46px}
  .f{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);
    border-radius:17px;padding:22px 18px;text-align:center;transition:.25s}
  .f:hover{border-color:var(--line);transform:translateY(-4px)}
  .f .i{font-size:26px;margin-bottom:10px}
  .f h3{font-size:15px;margin-bottom:5px}
  .f p{color:var(--muted);font-size:12px;line-height:1.55}
  footer{margin-top:46px;text-align:center;color:var(--muted);font-size:12px}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line2)}
  footer a:hover{color:var(--brand3)}
  footer .sep{margin:0 10px;opacity:.4}
  @media(max-width:760px){.feat{grid-template-columns:repeat(2,1fr)}.head h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mark">L</div>
    <div class="eyebrow">LIREAL · IMMERSIVE VENUE</div>
    <h1>沉浸式場域<br><span>虛實整合娛樂平台</span></h1>
    <p>360° 全息舞台、裸視 3D 觀看、AI 夥伴陪伴與場域限定票券，在同一個空間裡完整體驗。</p>
    <div class="cta">
      <a class="btn btn-brand" href="/app">進入平台</a>
      <a class="btn btn-ghost" href="/app#ticket">場域售票</a>
    </div>
  </div>

  <div class="feat">
    <div class="f"><div class="i">🎭</div><h3>沉浸節目</h3><p>全息舞台與 360° 沉浸場域演出</p></div>
    <div class="f"><div class="i">📡</div><h3>直播互動</h3><p>即時直播與 AI 夥伴陪伴</p></div>
    <div class="f"><div class="i">🎟️</div><h3>場域售票</h3><p>線上選位購票，含包廂席次</p></div>
    <div class="f"><div class="i">🕶️</div><h3>裸視 3D</h3><p>沉浸觀看裝備精選商品</p></div>
  </div>

  <footer>
    © 2026 LiReal 沉浸式場域
    <span class="sep">·</span>
    <a href="/admin">管理後台</a>
  </footer>
</div>
</body>
</html>
